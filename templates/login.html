{% extends "base.html" %}
{% block title %}Entrar — K{% endblock %}
{% block content %}
<div class="k-auth">
    <div class="k-auth__card">
        <a class="k-auth__logo" href="{{ url_for('welcome') }}" aria-label="K">K</a>
        <h1>Bem-vindo de volta</h1>
        <p class="k-hint">Entre na sua conta do K.</p>

        <form method="POST" class="k-form">
            <div class="k-field">
                <label for="login">Usuário ou e-mail</label>
                <input id="login" type="text" name="login" placeholder="@usuario ou e-mail"
                       autocomplete="username" autocapitalize="none" required autofocus>
            </div>
            <div class="k-field">
                <label for="login-password">Senha</label>
                <div class="k-password">
                    <input id="login-password" type="password" name="password" placeholder="Sua senha"
                           autocomplete="current-password" required>
                    <button type="button" onclick="kTogglePassword('login-password', this)">Mostrar</button>
                </div>
            </div>
            <button type="submit" class="k-btn k-btn--primary k-btn--block">Entrar</button>
        </form>

        <p class="k-auth__foot">Não tem conta? <a href="{{ url_for('register') }}">Criar conta</a></p>
    </div>
</div>
{% endblock %}
